## This file only demonstrates the binding syntax for regular (non-script) shortcuts.
## You can also specify this file as the default keybinding file using --input-conf in mpv.conf.
## View the list of bound keys on page 4 of the (Shift+)I stats overlay.
## Custom keybinding rules: https://hooke007.github.io/unofficial/mpv_input.html


####################
## Regular Operations ##
####################

## Format: [Key]  [Command]  # [Comment]
## Note: If --no-input-builtin-bindings is set in mpv.conf, you do NOT need
## to explicitly "ignore" keys you want to leave unbound.
## Full mpv built-in key reference:  https://github.com/mpv-player/mpv/blob/master/etc/input.conf
## All available commands:           https://mpv.io/manual/master/#input-conf


## ── Mouse ────────────────────────────────────────────────────────────────

 MBTN_LEFT            ignore                       # (No action)                      [Left click]
 MBTN_LEFT_DBL        cycle fullscreen             # Toggle fullscreen                 [Left double-click]
 MBTN_BACK            playlist-prev                # Previous file in playlist         [Back button]
 MBTN_FORWARD         playlist-next                # Next file in playlist             [Forward button]
# MBTN_MID            ignore                       # (Not bound by default — if used, consider clearing accidental triggers)

 WHEEL_UP             seek -10                     # Seek back 10 seconds              [Scroll up]
 WHEEL_DOWN           seek  10                     # Seek forward 10 seconds           [Scroll down]
# WHEEL_LEFT          ignore                       # (No action)
# WHEEL_RIGHT         ignore                       # (No action)


## ── Keyboard ─────────────────────────────────────────────────────────────

 Ctrl+v               loadfile ${clipboard/text}   # Open URL from clipboard

 q                    quit                         # Quit mpv
 Q                    quit-watch-later             # Quit and save current position
 o                    show-progress                # Show timecode / progress bar (temporary)
 O                    no-osd cycle-values osd-level 3 1   # Toggle persistent OSD timecode

 1                    add contrast   -0.5          # Contrast −
 2                    add contrast    0.5          # Contrast +
 3                    add brightness -0.5          # Brightness −
 4                    add brightness  0.5          # Brightness +
 5                    add gamma      -0.5          # Gamma −
 6                    add gamma       0.5          # Gamma +
 7                    add saturation -0.5          # Saturation −
 8                    add saturation  0.5          # Saturation +
 9                    add hue        -0.5          # Hue −
 0                    add hue         0.5          # Hue +
 Ctrl+BS              set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0   # Reset video equalizer

## Output rotation — note: rotating may trigger thumbnail rebuild and can
## cause chroma upscaling artifacts (fix: set cscale=bilinear, enable deband, or use software decode).
 Ctrl+LEFT            cycle-values video-rotate "0" "270" "180" "90"   # Rotate video 90° counter-clockwise
 Ctrl+RIGHT           cycle-values video-rotate "0" "90" "180" "270"   # Rotate video 90° clockwise

 Alt+0                cycle-values current-window-scale "0.5" "1.0" "1.5"   # Quick window size toggle
 Alt+`                set current-window-scale  1.0    # Reset window to 1× size
 Alt+1                add current-window-scale -0.1    # Shrink window
 Alt+2                add current-window-scale  0.1    # Grow window
 Alt+9                cycle-values panscan "0.0" "1.0" # Toggle fit/fill video in window
 Alt+-                add video-zoom  -0.1             # Zoom video out (window unchanged)
 Alt+=                add video-zoom   0.1             # Zoom video in (window unchanged)
 Alt+LEFT             add video-pan-x -0.1             # Pan video left
 Alt+RIGHT            add video-pan-x  0.1             # Pan video right
 Alt+UP               add video-pan-y -0.1             # Pan video up
 Alt+DOWN             add video-pan-y  0.1             # Pan video down
 Alt+BS               set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0   # Reset video zoom and pan
 Alt+b                cycle border                     # Toggle window border

 V                    cycle video                      # Switch video track
 SPACE                cycle pause                      # Toggle play/pause
 Ctrl+Alt+SPACE       stop                             # Stop playback
 T                    cycle ontop                      # Toggle always-on-top
 t                    set ontop yes                    # Enable always-on-top
 f                    cycle fullscreen                 # Toggle fullscreen
 ENTER                set fullscreen yes               # Enter fullscreen
 ESC                  set fullscreen no                # Exit fullscreen
 l                    ab-loop                          # Set/clear A-B loop points
 L                    cycle-values loop-file "inf" "no"   # Toggle loop current file
 ,                    frame-back-step                  # Step one frame back (paused)
 .                    frame-step                       # Step one frame forward (paused)
 Ctrl+,               add chapter -1                   # Previous chapter
 Ctrl+.               add chapter  1                   # Next chapter
 <                    playlist-prev                    # Previous file in playlist
 >                    playlist-next                    # Next file in playlist
 LEFT                 seek -5                          # Seek back 5 seconds
 Shift+LEFT           seek -1 exact                    # Seek back 1 second (precise)
 RIGHT                seek  5                          # Seek forward 5 seconds
 Shift+RIGHT          seek  1 exact                    # Seek forward 1 second (precise)
 UP                   sub-seek -1                      # Seek to previous subtitle timestamp
 DOWN                 sub-seek  1                      # Seek to next subtitle timestamp
 [                    add speed -0.1                   # Decrease playback speed (min: 0.01)
 ]                    add speed  0.1                   # Increase playback speed (max: 100)
 {                    multiply speed 0.5               # Halve playback speed
 }                    multiply speed 2.0               # Double playback speed
 BS                   set speed 1.0                    # Reset playback speed

 d                    cycle deinterlace                # Toggle deinterlacing
 D                    cycle deband                     # Toggle debanding
 j                    add sharpen -0.1                 # Sharpness − (min: −1)
 k                    add sharpen  0.1                 # Sharpness + (max: 1)
 Ctrl+h               cycle-values hwdec "auto" "auto-copy" "no"   # Toggle hardware / copy / software decode
 P                    cycle correct-pts                # Toggle timestamp parsing mode

## To quickly switch audio output devices, replace the UUIDs below with your device IDs.
## Obtain device names via the FAQ or: https://mpv.io/manual/master/#options-audio-device
# A                   cycle-values audio-device "wasapi/{GUID-A}" "wasapi/{GUID-B}"

 -                    add volume -1                    # Volume −
 =                    add volume  1                    # Volume +
 m                    cycle mute                       # Toggle mute
 Alt+c                add aid -1                       # Previous audio track
 Alt+v                add aid  1                       # Next audio track
 c                    add audio-delay -0.1             # Advance audio sync by 100ms
 v                    add audio-delay  0.1             # Delay audio sync by 100ms
 z                    add sub-delay -0.1               # Advance subtitle sync by 100ms
 x                    add sub-delay +0.1               # Delay subtitle sync by 100ms
 Shift+BS             set audio-delay 0 ; set sub-delay 0   # Reset audio and subtitle sync
 Z                    add sub-scale -0.1               # Decrease subtitle size
 X                    add sub-scale +0.1               # Increase subtitle size
 Ctrl+z               add sub-pos -1                   # Move subtitles up
 Ctrl+x               add sub-pos +1                   # Move subtitles down
 Alt+z                add sid -1                       # Previous subtitle track
 Alt+x                add sid  1                       # Next subtitle track
 Alt+Z                add secondary-sid -1             # Previous secondary subtitle track
 Alt+X                add secondary-sid  1             # Next secondary subtitle track
## For dual-subtitle issues and alternative implementations, see:
## https://github.com/hooke007/mpv_PlayKit/discussions/61
 Ctrl+Alt+z           cycle sub-ass-vsfilter-blur-compat
## Toggle VSFilter blur compat — use this if an ASS subtitle appears stretched or distorted.
## See: https://github.com/bubblesub/bubblesub/issues/85

 s                    screenshot                       # Screenshot with subtitles (original resolution)
 S                    screenshot video                 # Screenshot without subtitles (original resolution)
 Ctrl+s               screenshot window                # Screenshot with subtitles and OSD (display resolution)
 Alt+s                screenshot each-frame            # Frame-by-frame screenshots (run again to stop)
## Frame-by-frame screenshots default to the same method as "s".
## Append "video" or "window" after "each-frame" to change the method.
## Use --framedrop=no in mpv.conf to avoid duplicate or dropped frames in screenshots.
