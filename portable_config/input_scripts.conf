## This file only demonstrates the binding syntax for (some) scripts.
## For all available custom command bindings for each script,
## refer to the specific documentation for that script.


###############
## Lua Scripts ##
###############

## ── Built-in Lua Scripts (bundled with mpv) ──────────────────────────────

## (osc.lua) ─────────────────────────────────────────────────────────────
 DEL                  script-binding osc/visibility          # Toggle built-in OSC visibility
 Alt+DEL              script-message osc-show                # Temporarily show built-in OSC

## (stats.lua) ───────────────────────────────────────────────────────────
## While displayed, number keys 0–5 switch pages;
## pages 0, 2, 4, 5 support UP/DOWN arrow scrolling.
 i                    script-binding display-stats           # Temporarily display statistics
 I                    script-binding display-stats-toggle    # Toggle persistent statistics display
 k                    script-binding display-page-2          # Temporarily display statistics page 2
 K                    script-binding display-page-2-toggle   # Toggle persistent display of statistics page 2

## (commands.lua) ────────────────────────────────────────────────────────
## Built-in extension using console (console.lua) for OSD command input and info display.
 `                    script-binding commands/open           # Open OSD command line (press Esc to exit)

## (select.lua) ──────────────────────────────────────────────────────────
## Built-in multi-function script using console (console.lua).
## Allows switching chapters, subtitles, audio tracks, viewing property status, etc.
## While the select menu is active, the following keys are dynamically overridden:
##   DOWN or Ctrl+N → move cursor down
##   UP   or Ctrl+P → move cursor up
##   PGDWN or Ctrl+F → page down
##   PGUP  or Ctrl+B → page up
 g                    ignore
 g-m                  script-binding select/menu                   # Open select main menu
 g-p                  script-binding select/select-playlist        # Open submenu: Playlist
 g-t                  script-binding select/select-track           # Open submenu: All tracks list
 g-S                  script-binding select/select-secondary-sid   # Open submenu: Secondary subtitle track list
 g-r                  script-binding select/show-properties        # Open submenu: Property list

## (positioning.lua) ─────────────────────────────────────────────────────
 Ctrl+MBTN_MID        script-binding positioning/align-to-cursor            # Move image (follow cursor)
 Ctrl+MBTN_LEFT       script-binding positioning/drag-to-pan                # Drag to pan image
 Ctrl+WHEEL_UP        script-binding positioning/cursor-centric-zoom  0.1   # Zoom in (cursor-centered)
 Ctrl+WHEEL_DOWN      script-binding positioning/cursor-centric-zoom -0.1   # Zoom out (cursor-centered)


## ── External Script Bindings ─────────────────────────────────────────────
## Bindings appended here coexist with each script's built-in default bindings.
## Some scripts allow shortcut customization via /script-opts/ — follow
## the script developer's instructions first.

## (contextmenu_plus.lua) ─────────────────────────────────────────────────
 MBTN_MID             context-menu                                       # Open graphical context menu [Middle click]

## (input_plus.lua) ───────────────────────────────────────────────────────
 Ctrl+a               script-binding input_plus/adevice_back             # Switch to previous audio device (within current --ao)
 m                    script-binding input_plus/mark_aid_fin             # Mark audio track: A → mark B → merge → cancel
 Alt+p                script-binding input_plus/playlist_order_0         # Shuffle / unshuffle playlist
 CLOSE_WIN            script-binding input_plus/quit_real                # Confirm before quitting (prevents accidental close)
 Shift+RIGHT          script-binding input_plus/seek_acc                 # [Hold/Release] Non-linear forward seek (streaming-style)
 b                    script-binding input_plus/speed_auto               # [Hold/Release] Speed 2x while held → 1x on release

## (playlist_osd.lua) ─────────────────────────────────────────────────────
## While advanced playlist is open: arrow keys to navigate, Enter to play,
## Backspace to remove, Esc to close (auto-closes on timeout).
 Shift+ENTER          script-binding playlist_osd/display                # Display advanced playlist OSD
 Shift+Alt+DOWN       script-message-to playlist_osd random              # Jump to a random playlist entry

## (save_global_props.lua) ────────────────────────────────────────────────
 Ctrl+r               script-message-to save_global_props clean_data     # Clear saved property values

## (stats_mediainfo.lua) ──────────────────────────────────────────────────
 Alt+i                script-binding stats_mediainfo/display_toggle      # Toggle persistent MediaInfo statistics display
 Ctrl+i               script-binding stats_mediainfo/copy2clipboard      # Copy current file's MediaInfo to clipboard

## (thumbfast.lua) ────────────────────────────────────────────────────────
 Ctrl+Alt+t           script-binding thumbfast/thumb_rerun               # Restart thumbnail generation (fixes frozen thumbnails)
 Ctrl+t               script-binding thumbfast/thumb_toggle              # Toggle thumbnail preview
 Ctrl+T               script-message thumb_hwdec toggle                  # Toggle thumbnail hardware decoding

## (uosc/) ────────────────────────────────────────────────────────────────
 MBTN_RIGHT           script-binding uosc/menu                           # Open uosc OSD context menu [Right click]
