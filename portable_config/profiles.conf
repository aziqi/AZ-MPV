### profiles.conf
### Docs: https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/profiles.conf


####################
# Conditional Profiles #
####################

[speed_limit1]
profile-desc = Minimum playback speed limit
profile-cond = p.speed < 0.1
speed        = 0.1


[speed_limit2]
profile-desc = Maximum playback speed limit
profile-cond = p.speed > 8
speed        = 8


[ontop_playback]
profile-desc    = Auto always-on-top when playing
# Uncomment the line below to enable automatic activation:
#profile-cond   = not pause and not p.idle_active
profile-restore = copy
ontop           = yes


# Reference: https://github.com/mpv-player/mpv/issues/11122
[vsync_auto]
profile-desc    = Disable interpolation for high-framerate or non-1x speed content
profile-cond    = p.container_fps > 32 or (p.display_fps / p.container_fps) > 3.2 or p.speed ~= 1
profile-restore = copy
interpolation   = no
video-sync      = audio


[deband_bitrate]
profile-desc    = Enable debanding for low-bitrate content (< 3000 kbps)
profile-cond    = ((p.file_size / 1024) * 8) / p.duration <= 3000
profile-restore = copy
deband          = yes


[save_props_auto]
profile-desc          = Disable save-on-quit when near end, short file, or image/album
profile-cond          = p.percent_pos >= 90 or p.duration <= 300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
profile-restore       = copy
save-position-on-quit = no


[HDR_generic]
profile-desc    = Generic HDR settings (activated when signal peak > 1)
profile-cond    = p["video-params/sig-peak"] > 1
profile-restore = copy
blend-subtitles   = no
# tone-mapping    = hable
# gamut-mapping-mode = clip
hdr-reference-white  = 100
hdr-peak-percentile  = 99.99
# target-peak     = 100
# sub-color       = 0.7
# sub-border-color = 0.1
# sub-back-color  = "#00000000"
# sub-shadow-offset = 0
