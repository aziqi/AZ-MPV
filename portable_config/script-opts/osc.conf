### Comments must be on a new line. Do not place comments after parameters.
### Do not allow extra spaces between options and values.

showwindowed=yes
# Show OSC when windowed. Default: yes.
showfullscreen=yes
# Show OSC when in fullscreen. Default: yes.
idlescreen=yes
# Show logo when idle. Default: yes.
scalewindowed=1
# OSC scaling factor in windowed mode. Default: 1.
scalefullscreen=1
# OSC scaling factor in fullscreen mode. Default: 1.
vidscale=auto
# <no|yes|auto> Scale OSC with video size. 'auto' follows --osd-scale-by-window.
valign=0.8
# <-1(top) to 1(bottom)> Vertical alignment. Default: 0.8.
halign=0
# <-1(left) to 1(right)> Horizontal alignment. Default: 0.
barmargin=0
# Vertical margin for bar-style layouts. Default: 0.
boxalpha=80
# <0-255> Overall opacity of the box element. Default: 80.

hidetimeout=500
# Duration in ms before OSC hides if mouse is still. Default: 500.
fadeduration=200
# Fade-out duration in ms. Set to 0 for no animation. Default: 200.
fadein=no
# Enable fade-in effect.
deadzonesize=0.5
# <0.0-1.0> Interaction logic for cursor and OSC area. Default: 0.5.
minmousemove=0
# Minimum pixels mouse must move to show OSC. Default: 0.

layout=bottombar
# <box|slimbox|bottombar|topbar|slimbottombar|slimtopbar> Choose built-in layout.
seekbarstyle=bar
# <bar|diamond|knob> Choose seekbar style.
seekbarhandlesize=0.6
# Size of diamond/knob relative to seekbar height. Default: 0.6.
seekrangestyle=inverted
# <bar|line|slider|inverted|none> Style of search range.
seekrangeseparate=yes
# Separate seekrange from seekbar (for bar style). Default: yes.
seekrangealpha=200
# <0-255> Opacity of seekrange. Default: 200.
seekbarkeyframes=yes
# Use keyframes for seekbar dragging. 'no' for exact seeking (slower). Default: yes.
scrollcontrols=yes
# Enable mouse wheel interaction for elements. Default: yes.

title=${!playlist-count==1:[${playlist-pos-1}/${playlist-count}] }${media-title}
# OSC title string compatible with property expansion.
# See: https://mpv.io/manual/master/#property-list

tooltipborder=1
# Tooltip border thickness for bar layouts. Default: 1.
timetotal=no
# Show total time instead of remaining time. Default: no.
remaining_playtime=yes
# Calculate remaining time based on playback speed. Default: yes.
timems=no
# Display timecodes with millisecond precision. Default: no.
tcspace=100
# Space between timecodes (font size compensation). Default: 100.
visibility=auto
# <never|auto|always> OSC visibility mode.
visibility_modes=never_auto_always
# Cycle order for visibility script messages.

boxmaxchars=80
# Max characters for title in box layout. Default: 80.
boxvideo=no
# OSC layout behavior relative to video. Default: no.
windowcontrols=auto
windowcontrols_alignment=right
# Window controls for borderless mode.
windowcontrols_title=${media-title}
# Top title for borderless mode.
greenandgrumpy=no
# Disable holiday Easter eggs. Default: no.
livemarkers=yes
# Update chapter markers in real-time. Default: yes.

chapter_fmt=Chapter: %s
# Format for chapter info on hover. Set to 'no' to hide.
unicodeminus=no
# Use Unicode minus character. Default: no.

## Color customizations
background_color=#000000
timecode_color=#FFFFFF
title_color=#FFFFFF
time_pos_color=#FFFFFF
time_pos_outline_color=#FFFFFF
buttons_color=#FFFFFF
top_buttons_color=#FFFFFF
small_buttonsL_color=#FFFFFF
small_buttonsR_color=#FFFFFF
held_element_color=#999999
time_pos_outline_color=#000000

tick_delay=0.0167
# Minimum interval in seconds between OSC renders.
tick_delay_follow_display_fps=no
# Match render interval to display refresh rate.

## Custom command bindings for OSC buttons
menu_mbtn_left_command=script-binding select/menu; script-message-to osc osc-hide
menu_mbtn_mid_command=
menu_mbtn_right_command=

playlist_prev_mbtn_left_command=playlist-prev
playlist_prev_mbtn_mid_command=show-text ${playlist} 3000
playlist_prev_mbtn_right_command=script-binding select/select-playlist; script-message-to osc osc-hide

playlist_next_mbtn_left_command=playlist-next
playlist_next_mbtn_mid_command=show-text ${playlist} 3000
playlist_next_mbtn_right_command=script-binding select/select-playlist; script-message-to osc osc-hide

title_mbtn_left_command=script-binding stats/display-page-5
title_mbtn_mid_command=show-text ${path}
title_mbtn_right_command=script-binding select/select-watch-history; script-message-to osc osc-hide

play_pause_mbtn_left_command=cycle pause
play_pause_mbtn_mid_command=cycle-values loop-playlist inf no
play_pause_mbtn_right_command=cycle-values loop-file inf no

chapter_prev_mbtn_left_command=osd-msg add chapter -1
chapter_prev_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_prev_mbtn_right_command=script-binding select/select-chapter; script-message-to osc osc-hide

chapter_next_mbtn_left_command=osd-msg add chapter 1
chapter_next_mbtn_mid_command=show-text ${chapter-list} 3000
chapter_next_mbtn_right_command=script-binding select/select-chapter; script-message-to osc osc-hide

audio_track_mbtn_left_command=cycle audio
audio_track_mbtn_mid_command=cycle audio down
audio_track_mbtn_right_command=script-binding select/select-aid; script-message-to osc osc-hide
audio_track_wheel_down_command=cycle audio
audio_track_wheel_up_command=cycle audio down

sub_track_mbtn_left_command=cycle sub
sub_track_mbtn_mid_command=cycle sub down
sub_track_mbtn_right_command=script-binding select/select-sid; script-message-to osc osc-hide
sub_track_wheel_down_command=cycle sub
sub_track_wheel_up_command=cycle sub down

volume_mbtn_left_command=no-osd cycle mute
volume_mbtn_mid_command=
volume_mbtn_right_command=script-binding select/select-audio-device; script-message-to osc osc-hide
volume_wheel_down_command=add volume -5
volume_wheel_up_command=add volume 5

fullscreen_mbtn_left_command=cycle fullscreen
fullscreen_mbtn_mid_command=
fullscreen_mbtn_right_command=cycle window-maximized