### Comments after parameters are not supported — must be on a separate line
### Extra spaces between options and values are not allowed

# -- Dynamic key bindings (corresponding to six different info pages)
key_page_1=1
key_page_2=2
key_page_3=3
key_page_4=4
key_page_5=5
key_page_0=0
# -- Dynamic key bindings (pages 2/4/5/0 support scrolling up/down)
key_scroll_up=UP
key_scroll_down=DOWN
key_search=/
key_exit=ESC
## Page 4 supports manual keyword filtering
scroll_lines=1
## Number of lines to scroll per step

duration=4
## Duration in seconds for temporary display. Default: 4
redraw_delay=1
## Data refresh interval in seconds for persistent display. Setting to 0 causes bugs. Default: 1
ass_formatting=yes
persistent_overlay=no
## Prevent other OSD text from overlapping stats info. Default: no
filter_params_max_length=100
## If the filter list exceeds this character limit, each filter is shown on its own line instead of a single line.
file_tag_max_length=128
file_tag_max_count=16
## Only show file tags shorter than this length (in bytes).
## Only show the first specified number of file tags.
show_frame_info=no
## Whether to show information about the current frame
term_clip=yes
## Whether to truncate lines to terminal width. Default: yes
debug=no

# -- Plot-related options and styles
plot_perfdata=yes
plot_vsync_ratio=yes
plot_vsync_jitter=yes
plot_cache=yes
plot_tonemapping_lut=no
skip_frames=5
global_max=yes
flush_graph_data=yes
## Clear cached data when toggling display
plot_bg_border_color=0000FF
plot_bg_color=262626
plot_color=FFFFFF
plot_bg_border_width=1.25

# -- Font settings
font=
font_mono=monospace
## Only the monospaced font needs to be set
font_size=20
## Font size
font_color=
border_size=1.65
## Font border thickness
border_color=
#shadow_x_offset=0.0
#shadow_y_offset=0.0
## Defaults to the value of mpv's --osd-shadow-offset option
shadow_color=
alpha=11
## Font transparency. Default: 11
vidscale=auto
## <no|yes|auto (default)> Scale stats with video size?
## The value 'auto' follows --osd-scale-by-window so stats scale together with the OSD.

# -- Custom ASS tag header for text output styling
custom_header=
## Specifying this ignores the text style values above and uses this string instead.

# -- Text formatting
# -- If using ASS
ass_nl=\N
ass_indent=\h\h\h\h\h
ass_prefix_sep=\h\h
ass_b1={\b1}
ass_b0={\b0}
ass_it1={\i1}
ass_it0={\i0}
# -- If not using ASS
no_ass_nl=\n
no_ass_indent=    
no_ass_prefix_sep= 
no_ass_b1=\027[1m
no_ass_b0=\027[0m
no_ass_it1=\027[3m
no_ass_it0=\027[0m

bindlist=no
## Output the contents of page 4 to the terminal on mpv startup and exit
