### Comments after parameters are not supported — must be on a separate line
### Extra spaces between options and values are not allowed

# Socket path. Leave empty for automatic.
socket=
# Thumbnail cache path. Leave empty for automatic.
tnpath=

# Maximum thumbnail size in pixels. Default: 320
max_height=320
max_width=320

# Do not change this unless you know what it does.
overlay_id=42

# Start generating thumbnails when a file is loaded. Default: no
spawn_first=no
# Whether to quit the thumbnail subprocess after this many seconds of inactivity (0 = disabled). Default: 0
quit_after_inactivity=0
# Whether to enable thumbnails for network streams. Default: no
network=no
# Whether to enable thumbnails for audio files. Default: no
audio=no
# [Windows + LuaJIT only] Use the native Windows API to write to the pipe. Default: yes
direct_io=yes

# Decoding API to use. In thumbnail encoding mode only limited APIs are available and copy mode may be forced.
# Default 'yes' means prefer hardware decoding.
hwdec=yes
# Number of software decoding threads (used when hardware decoding is unavailable or hwdec=no).
# For Dolby Vision, 6+ is recommended. More than 16 is pointless. Default: 2
sw_threads=2
# Custom mpv binary path. Mac bundle-app users can set this to 'bundle'. Default: default
binpath=default
# Only enable thumbnails for videos longer than this duration in seconds. 0 = disabled. Default: 10
min_duration=10
# <0 (default)|1|2> Preview accuracy.
# 0 = auto (exact frame only when cursor is still), 1 = always keyframe, 2 = always exact frame
precise=0
# <1 (default)|2|3> Preview quality mode.
# 1 = fastest but HDR may appear slightly undersaturated
# 2 = close to GPU rendering but HDR may appear slightly oversaturated
# 3 = correct single-layer Dolby Vision output but very slow
quality=1
# Decoding frequency in seconds. Default: 0.125
frequency=0.125
