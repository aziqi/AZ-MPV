### Comments after parameters are not supported — must be on a separate line
### Extra spaces between options and values are not allowed

# Timeline style. Default: line. Other available value: bar
timeline_style=line
# Timeline line thickness in windowed mode. Default: 2
timeline_line_width=2
# Timeline height in pixels. 0 = hidden. Default: 40
timeline_size=40
# Extra background height rendered above the timeline to clearly mark boundaries. Default: 1
timeline_border=1
# Step size in seconds when using the mouse wheel on the timeline. Default: 1
# Prefix with ! for exact seeking, e.g.: !1
timeline_step=1
# Show cache range indicators on the timeline for streams. Default: yes
timeline_cache=yes
# Render YouTube heatmap on the timeline. Default: overlay. Other values: above, no
timeline_heatmap=overlay
# Whitelist of states where the timeline is always visible. Separate multiple values with commas.
# Default: idle,audio. Other available values: paused image video windowed fullscreen
timeline_persistency=idle,audio

# When to always show the minimized progress bar. Other values: windowed fullscreen always never
# Can also be toggled on demand with the `toggle-progress` command.
progress=windowed
progress_size=2
progress_line_width=20

# Custom control buttons above the timeline. Separate multiple values with commas. Use 'never' to disable.
# See "Extended script options" https://github.com/hooke007/mpv_PlayKit/discussions/186
controls=menu,ST-stats_tog,ST-thumb_tog,gap,play_pause,gap,command:aspect_ratio:script-binding menu_aspect/open?Aspect Ratio,gap,subtitles,audio,<has_chapter>chapters,<has_many_edition>editions,<has_many_video>video,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=idle,audio

# Volume control position. Default: right. Other values: none left
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=idle,audio

# Speed control settings. Click and drag or scroll to change value. Single click resets it.
speed_step=0.1
speed_step_is_factor=no
speed_persistency=idle,audio

# Context menu style
menu_item_height=36
menu_min_width=260
menu_padding=4
# Enable quick search in menu (just start typing). If disabled, use / or Ctrl+F to activate search.
# When enabled, if the input is a Unicode character, the same key can no longer close an open menu.
menu_type_to_search=yes

# Top bar visibility logic (only shown in borderless and fullscreen modes). Default: no-border
# Other available values: never always
top_bar=no-border
top_bar_size=40
# Enable top bar window controls. Other values: no left
top_bar_controls=right
# Enable main title in the top bar. 'yes' uses the setting from mpv.conf, 'no' disables it,
# or use a custom property expansion string. Recommended: ${media-title}
top_bar_title=yes
# Enable alternate title in the top bar. Leave empty to disable. Recommended: ${filename}
top_bar_alt_title=
# <below (default)|toggle> Display style for the alternate title
top_bar_alt_title_place=below
# Refresh the top bar when loading files within these categories.
# Separate multiple values with commas. Other values: audio video image chapter
top_bar_flash_on=video,audio
top_bar_persistency=

# Inner border size and opacity drawn in borderless mode. Default: 2
window_border_size=2

# If no other file exists in the playlist and the current file has not ended,
# uosc automatically loads the next file in the current directory. Default: no
# Use load_types to restrict which file types are auto-loaded.
# When enabled, uosc automatically sets: --keep-open=yes --keep-open-pause=no
autoload=no
# Enable shuffle playback for playlist/current directory. Default: no
shuffle=no

# UI element scale factor. Default: 0 (auto-calculated). Negative value = auto DPI scaling.
scale=0
# UI element scale compensation in fullscreen. Default: 1
scale_fullscreen=1
# Font scale factor. Default: 1
font_scale=1
# Use only the Bold font weight. Default: no
font_bold=no
# Text border for control elements. Default: 1.2
text_border=1.2
# Corner radius of rounded rectangles in UI elements. Default: 4
border_radius=4
# UI element colors. Separate multiple values with commas.
# Default values: foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,curtain=000000,success=a5e075,error=ff616e,match=69c5ff,heatmap=00adee
color=
# UI element opacity. Separate multiple values with commas. (Does not affect text.)
# Default values: timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,speed=0.6,menu=1,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.5,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4
opacity=

# Advanced feature enable list (disabling improves performance). Separate with commas.
# text_width = more accurate text width estimation
# sorting = more accurate list sorting
refine=text_width,sorting

# Duration of UI element animations in milliseconds
animation_duration=100
# Duration of the flash effect used by flash-{element} commands in milliseconds. Default: 1000
flash_duration=1000
# Distance in pixels for elements to fully fade in/out. Default: 40 120
proximity_in=40
proximity_out=120
# <total (default)|playtime-remaining|time-remaining> Display total time, remaining playback time, or remaining time
destination_time=total
# Sub-second precision for timecodes (decimal places after seconds). Default: 0
time_precision=0
# Hide UI elements when mpv hides the cursor. Default: no (see also --cursor-autohide in main config)
autohide=no
# Show buffered time on the timeline if buffered time is below this threshold in seconds. 0 = disabled. Default: 60
buffered_time_threshold=60
# Pause indicator style. Default: flash. Other values: static manual
# (controlled by flash-pause-indicator and decide-pause-indicator commands)
pause_indicator=flash
# Available quality options listed in the stream quality selector
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144

# File browser extension filter list for loading files / importing video and audio tracks.
# The default covers a very wide range; this preset is trimmed to common video and audio formats.
video_types=avi,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
audio_types=aac,ac3,ape,dsf,dts,flac,m4a,mka,mp3,ogg,opus,wav,wma,wv
image_types=apng,avif,bmp,gif,jfif,jpeg,jpg,jxl,png,svg,tif,tiff,webp
# File browser extension filter list for importing subtitles.
# The default covers a very wide range; this preset is trimmed to common subtitle formats.
subtitle_types=ass,idx,lrc,mks,pgs,sup,srt,ssa,txt,vtt
# File browser extension filter list for importing playlists. The example shown is the default value.
playlist_types=m3u,m3u8,pls,url,cue
# Restrict which file types are opened when navigating to the next file or using autoload.
# Available values: video,audio,image,playlist,same (where 'same' means same file type)
load_types=video

# Default directory for the file browser. The example shown is the default value.
# Special value {drives} means the root/drives list.
default_directory=~/
# List hidden files when reading directories. This feature is heavily platform-dependent.
show_hidden_files=no
# Move files to the recycle bin when deleted via built-in command (non-Windows requires trash-cli). Default: no
use_trash=no
# Dynamically adjust OSD margins based on UI element visibility. Default: no
adjust_osd_margins=no

# Convert common chapter types into chapter range indicator markers. The example shown is the default value.
# Add extra Lua patterns to identify the start of simple chapter ranges (all chapters except ads).
# See "Extended script options" https://github.com/hooke007/mpv_PlayKit/discussions/186
chapter_ranges=openings:30ABF964,endings:30ABF964,ads:C54E4E80
chapter_range_patterns=openings:オープニング;endings:エンディング

# In this version, this setting only controls language filtering when fetching subtitles from OpenSubtitles.
# Separate multiple values with commas. Special value 'slang' reads from --slang in the main config.
# Language codes used by the site: https://opensubtitles.stoplight.io/docs/opensubtitles-api/1de776d20e873-languages
languages=slang,en
# Subtitles are normally saved to the local file's path. For online playback, use this directory instead.
# The example shown is the default value.
# Prefix the path with ! to force saving all subtitles to the specified path: !~~/_cache/usubs
subtitles_directory=~~/_cache/usubs

# Disabled UI elements. Separate multiple values with commas. The following elements support user disabling:
# window_border,top_bar,timeline,controls,volume,idle_indicator,audio_indicator,buffering_indicator,pause_indicator
disable_elements=

# Show logo when idle (default: yes), and custom text message (default value 'default' = no message shown)
idlescreen=no
idlemsg=AZ-MPV
# Automatically open the context menu when idle. Set to a number between 0.02 and 2 for a delay trigger.
# Otherwise disabled (default).
idle_call_menu=0
# Custom UI font. Default value 'default' uses the font from --osd-font in the main config.
custom_font=default
# Custom path to the ziggy binary. Default value 'default' uses the preset directory from the script.
ziggy_pth=default
