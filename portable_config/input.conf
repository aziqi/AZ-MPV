## Standard key name reference (not exhaustive):
##
## Mouse buttons:
##   MBTN_LEFT  MBTN_RIGHT  MBTN_MID  MBTN_FORWARD  MBTN_BACK
##   WHEEL_UP  WHEEL_DOWN  WHEEL_LEFT  WHEEL_RIGHT
##
## Letters and numbers:
##   q  w  e  r ...  1  2  3  4 ...
##
## Uppercase and symbols:
##   Q  W  E  R ...  !  @  SHARP  $ ...
##
## Numpad:
##   KP1  KP2  KP3  KP_DEC  KP_ENTER  KP_ADD  KP_SUBTRACT  KP_MULTIPLY  KP_DIVIDE ...
##
## Special and function keys:
##   UP  DOWN  LEFT  RIGHT  ESC  TAB  BS  SPACE  HOME  END  PGUP  PGDWN  DEL ...
##
## Modifier combinations:
##   Shift+  Ctrl+  Alt+  Shift+Ctrl+  Shift+Alt+  Ctrl+Alt+  Shift+Ctrl+Alt+ ...
##
## Double-click and multi-key sequences:
##   MBTN_LEFT_DBL  MBTN_RIGHT_DBL  MBTN_MID_DBL  q-q  q-w  q-w-e  q-w-e-r ...



